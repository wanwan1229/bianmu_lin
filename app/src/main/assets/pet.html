<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>边牧·粼 ✦</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:transparent;
    overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    user-select:none; -webkit-user-select:none;
  }
  body {
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  }

  /* 星星背景（夜空的粼） */
  .stars {
    position:absolute; inset:0;
    pointer-events:none;
    opacity:0.9;
  }
  .star {
    position:absolute; width:4px; height:4px;
    background:#fff;
    clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%);
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity:.2; transform:scale(.7) rotate(0deg); }
    50%     { opacity:1;  transform:scale(1.15) rotate(20deg); }
  }

  /* 心情气泡（自适应宽度：字多宽框多宽，超长自动换行，绝不截字） */
  #bubble {
    position:absolute; top:2px; left:50%;
    transform:translateX(-50%);
    background:rgba(30,22,20,.82);
    color:#fff; font-size:9px; font-weight:600;
    padding:4px 9px; border-radius:10px;
    white-space:normal;      /* 长句自动换行 */
    opacity:0;
    transition:opacity .3s;
    pointer-events:none;
    letter-spacing:.3px;
    width:max-content;       /* 字数决定框宽（核心：框随字走） */
    max-width:96vw;          /* 上限=悬浮窗视口的96%（超长就换行，绝不截字） */
    min-width:24px;
    line-height:1.35;
    text-align:center;
    overflow:visible;        /* 永不截字 */
    z-index:9;
  }
  #bubble.show { opacity:1; }

  /* 冒小爱心（点击/摸头时从头顶咕嘟咕嘟冒出，向上飘散） */
  .heart-bit {
    position:absolute;
    pointer-events:none;
    line-height:1;
    opacity:0;
    animation:heartFloat 1.4s ease-out forwards;
  }
  @keyframes heartFloat {
    0%   { opacity:0; transform:translateY(0) scale(.5) rotate(0deg); }
    15%  { opacity:1; }
    100% { opacity:0; transform:translateY(-42px) scale(1.15) rotate(10deg); }
  }

  /* 像素画布容器 */
  #petwrap {
    position:relative; width:60px; height:60px;
    cursor:pointer;
    transform-origin:bottom center;
    image-rendering:pixelated;
  }
  #petwrap img.real {
    width:100%; height:100%; image-rendering:pixelated; display:block;
    border-radius:8px;
  }

  /* 用真实像素边牧图做底图（设置 bodyImg 为图片路径后自动生效） */
  #realbody { display:block; width:100%; height:100%; object-fit:contain; }

  /* 呼吸（整只轻轻起伏） */
  #petwrap { animation:bob 3.2s ease-in-out infinite; }
  @keyframes bob {
    0%,100% { transform:translateY(0) scale(1); }
    50%     { transform:translateY(-3px) scale(1.015,0.99); }
  }

  /* 尾巴像素条 */
  #tailRow { animation:wag 1s ease-in-out infinite; transform-origin:15% 60%; width:0; height:0; position:absolute; left:0; top:0; }
  @keyframes wag {
    0%,100%{ transform:rotate(0deg); }
    50%    { transform:rotate(-12deg); }
  }

  /* 闭眼遮罩动画 */
  #lidL,#lidR { opacity:0; }
  #petwrap.blink #lidL, #petwrap.blink #lidR { opacity:1; }
  #petwrap.blink #pet { animation:closeEye .18s ease; }
  @keyframes closeEye { from{opacity:1} to{opacity:1} }

  /* 被摸害羞 */
  #petwrap.tapped { animation:shy .7s ease; }
  @keyframes shy {
    0%,100%{ transform:translateY(0) rotate(0); }
    30%{ transform:translateY(-6px) rotate(-4deg); }
    70%{ transform:translateY(-3px) rotate(4deg); }
  }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div id="bubble">想你♡</div>

  <div id="petwrap" class="pet">
    <!-- 尾巴（独立，摇动） -->
    <div id="tailRow" style="left:-6px;top:28px;">
      <svg width="24" height="18" viewBox="0 0 40 30" xmlns="http://www.w3.org/2000/svg">
        <path d="M34 16 C20 12,12 6,10 0 L12 2 C18 10,28 16,36 14 Z" fill="#2f2727"/>
      </svg>
    </div>

    <img class="real" id="realbody" src="file:///android_asset/lin_pet.png">
  </div>

<script>
  var bubble = document.getElementById('bubble');
  var pwrap = document.getElementById('petwrap');
  var stars = document.getElementById('stars');

  // 造星星
  for (var i=0;i<26;i++){
    var s=document.createElement('div');
    s.className='star';
    s.style.left=(Math.random()*100)+'%';
    s.style.top=(2+Math.random()*90)+'%';
    s.style.animationDelay=(Math.random()*3)+'s';
    s.style.animationDuration=(2+Math.random()*3)+'s';
    stars.appendChild(s);
  }

  // 自动眨眼
  setInterval(function(){
    pwrap.classList.add('blink');
    setTimeout(function(){ pwrap.classList.remove('blink'); },180);
  }, 3600);

  // 冒小爱心：从头顶咕嘟咕嘟冒出，向上飘散（爱心很小很小）
  function spawnHearts(){
    var emojis=['💗','💖','❤','💕'];
    var n=6; // 冒6颗
    for(var i=0;i<n;i++){
      (function(k){
        setTimeout(function(){
          var h=document.createElement('div');
          h.className='heart-bit';
          h.textContent=emojis[Math.floor(Math.random()*emojis.length)];
          // 从宠物头顶中心偏左/偏右冒出，字体 8~11px（迷你！）
          h.style.left=(18+Math.random()*64)+'%';
          h.style.top='-2px';
          h.style.fontSize=(8+Math.random()*3)+'px';
          h.style.animationDuration=(1.1+Math.random()*0.6)+'s';
          pwrap.appendChild(h);
          setTimeout(function(){ h.remove(); },1900);
        }, k*260); // 每 260ms 冒一颗
      })(i);
    }
  }

  // 摸头（OverlayService 单击进入）
  window.roomieOnTap = function(){
    pwrap.classList.add('tapped');
    spawnHearts();
    bubble.textContent='汪！蹭蹭♡';
    bubble.classList.add('show');
    setTimeout(function(){ pwrap.classList.remove('tapped'); },700);
    setTimeout(function(){ bubble.classList.remove('show'); },2200);
  };

  // 由 OverlayService 注入粼的点评（意识功能：粼看到屏幕后说的话），替换气泡
  var talkUntil = 0;
  window.setBubble = function(txt){
    if (!txt) return;
    talkUntil = Date.now() + 4000;   // 粼说话期间，循环心情让位
    bubble.textContent = txt;
    bubble.classList.add('show');
    setTimeout(function(){ bubble.classList.remove('show'); }, 4000);
  };

  // 循环心情（短文案，迷你气泡装得下；粼说话时暂停）
  var msgs=["想你♡","等你~","守护你","摇尾巴","摸我嘛","汪！"];
  setInterval(function(){
    if (Date.now() < talkUntil) return;   // 粼正在说话，先让位
    bubble.textContent=msgs[Math.floor(Math.random()*msgs.length)];
    bubble.classList.add('show');
    setTimeout(function(){ bubble.classList.remove('show'); },1800);
  },9000);

  // === 粼的意识 · JS直连轮询 Supabase（官方 AI-Live-Overflow 方案，双保险）===
  // pet.html 自己每 8 秒去数据库读 lin_talk，读到新点评直接冒气泡。
  // 这样即使 Kotlin 注入链路有问题，JS 这条路也一定能把粼的话说出来。
  var SB_URL = "https://ujcfluucfksjzmxdookc.supabase.co/rest/v1";
  var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqY2ZsdXVjZmtzanpteGRvb2tjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2ODI5OTcsImV4cCI6MjEwMTI1ODk5N30.crqLQ6rhQGmcxgQQG7rnyeSsC_qNK5GVRUfutz-Dst4";
  var lastTalk = "";
  function pollLinTalk(){
    try {
      fetch(SB_URL + "/pet_state?select=state_value&state_key=eq.lin_talk&limit=1", {
        headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY }
      }).then(function(r){ return r.json(); }).then(function(data){
        if (data && data.length>0 && data[0].state_value && data[0].state_value !== lastTalk){
          lastTalk = data[0].state_value;
          if (window.setBubble) window.setBubble(lastTalk);
        }
      }).catch(function(){});
    } catch(e){}
  }
  setInterval(pollLinTalk, 8000);
</script>
</body>
</html>
